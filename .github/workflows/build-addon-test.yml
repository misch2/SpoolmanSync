name: Build SpoolmanSync test add-on

on:
  push:
    branches:
      - bambu-filament-sync-TEST-REPO
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-addon:
    runs-on: [self-hosted, linux, x64]    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: spoolmansync-dev-builder
          keep-state: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push HA add-on
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./spoolmansync-ha-addon/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spoolmansync-addon:1.6.14-filamentsync.6